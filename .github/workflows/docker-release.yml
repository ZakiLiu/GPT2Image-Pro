name: Docker Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image: gpt2image-pro-web
            dockerfile: Dockerfile.web
            target: runner
          - name: migrate
            image: gpt2image-pro-migrate
            dockerfile: Dockerfile.web
            target: migrator
          - name: chatgpt-web-proxy
            image: gpt2image-pro-chatgpt-web-proxy
            dockerfile: Dockerfile.chatgpt-web-proxy
            target: runner
          - name: chatgpt-register
            image: gpt2image-pro-chatgpt-register
            dockerfile: Dockerfile.chatgpt-register
            target: runner

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5（钉 SHA；dependabot 维护）

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/meowfree/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_APP_NAME=GPT2IMAGE
            NEXT_PUBLIC_PAYMENT_PROVIDER=none
            NEXT_PUBLIC_GENERATIONS_BUCKET_NAME=generations
            NEXT_PUBLIC_AVATARS_BUCKET_NAME=avatars
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/')
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: GPT2IMAGE
      NEXT_PUBLIC_PAYMENT_PROVIDER: none
      NEXT_PUBLIC_GENERATIONS_BUCKET_NAME: generations
      NEXT_PUBLIC_AVATARS_BUCKET_NAME: avatars
      DATABASE_URL: postgresql://gpt2image:gpt2image@localhost:5432/gpt2image
      BETTER_AUTH_SECRET: build-time-placeholder-secret-not-for-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5（钉 SHA；dependabot 维护）

      - uses: ./.github/actions/setup

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: services/chatgpt-web-proxy/go.mod
          cache-dependency-path: services/chatgpt-web-proxy/go.sum

      - name: Prepare compose bundle
        run: |
          mkdir -p dist/compose
          cp docker-compose.yml docker-compose.build.yml .env.docker.example README.md dist/compose/
          tar -czf gpt2image-pro-${GITHUB_REF_NAME}.compose.tar.gz -C dist/compose .
          (cd dist && zip -r ../gpt2image-pro-${GITHUB_REF_NAME}.compose.zip compose)

      - name: Verify binary-style deployment contract
        run: pnpm verify:binary-contract

      - name: Build web standalone
        run: pnpm build:web

      - name: Test ChatGPT Web proxy
        working-directory: services/chatgpt-web-proxy
        run: go test ./...

      - name: Build ChatGPT Web proxy binary
        working-directory: services/chatgpt-web-proxy
        run: |
          mkdir -p ../../dist/binary-style/build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../dist/binary-style/build/chatgpt-web-proxy .

      - name: Build binary-style release bundle
        run: |
          pnpm build:binary-bundle -- \
            --version "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --platform linux-x64 \
            --proxy-binary dist/binary-style/build/chatgpt-web-proxy

      - name: Verify binary-style release bundle
        run: |
          pnpm verify:binary-bundle -- \
            --bundle-dir "dist/binary-style/${GITHUB_REF_NAME}/gpt2image-pro-${GITHUB_REF_NAME}-linux-x64" \
            --manifest "dist/binary-style/${GITHUB_REF_NAME}/manifest.json" \
            --artifact "dist/binary-style/${GITHUB_REF_NAME}/gpt2image-pro-${GITHUB_REF_NAME}-linux-x64.tar.gz"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            gpt2image-pro-${{ github.ref_name }}.compose.tar.gz
            gpt2image-pro-${{ github.ref_name }}.compose.zip
            dist/binary-style/${{ github.ref_name }}/gpt2image-pro-${{ github.ref_name }}-linux-x64.tar.gz
            dist/binary-style/${{ github.ref_name }}/gpt2image-pro-${{ github.ref_name }}-linux-x64.tar.gz.sha256
            dist/binary-style/${{ github.ref_name }}/gpt2image-pro-${{ github.ref_name }}-linux-x64.zip
            dist/binary-style/${{ github.ref_name }}/gpt2image-pro-${{ github.ref_name }}-linux-x64.zip.sha256
            dist/binary-style/${{ github.ref_name }}/manifest.json
            dist/binary-style/${{ github.ref_name }}/SHA256SUMS
